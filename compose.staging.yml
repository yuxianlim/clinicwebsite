services:
  app:
    image: ${RELEASE_IMAGE:?Set RELEASE_IMAGE to an immutable GHCR digest}
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      APP_DEPLOYMENT_MODE: fictional-staging
      ENABLE_FICTIONAL_STAGING_WORKFLOWS: "true"
      STAGING_PUBLIC_ORIGIN: https://aven.sean.tcmusa.ai
      CLINIC_DATA_DIR: /data
      AUDIT_LOG_DB_PATH: /data/clinic-audit.sqlite
      CLINIC_APPOINTMENTS_DB_PATH: /data/clinic-appointments.sqlite
      CLINIC_AUTH_DB_PATH: /data/clinic-auth.sqlite
      CLINIC_LOGIN_RATE_LIMIT_DB_PATH: /data/clinic-login-limits.sqlite
      KIOSK_RATE_LIMIT_DB_PATH: /data/clinic-rate-limits.sqlite
      CLINIC_BACKUP_DIR: /data/backups
    volumes:
      - ./state:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks: [clinic]

  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to an immutable Caddy digest}
    restart: unless-stopped
    env_file: .env.staging
    ports:
      - "${CADDY_BIND_IP:?Set CADDY_BIND_IP to the school-proxy-facing server address}:${CADDY_HOST_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:size=16m
      - /data:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      app:
        condition: service_healthy
    networks: [clinic]

networks:
  clinic: {}
